<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FestDesk · DRMC IT Club Event Registration</title>
<meta name="description" content="Browse fests, explore events and register in one place. Organizer dashboard included. Built for the DRMC International Tech Carnival 2026 AI Web Development Contest.">
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#101c33;--muted:#5b667a;--line:#e3e0d8;
  --accent:#0b7a75;--accent-ink:#ffffff;--accent-soft:#dff3f1;
  --ok:#17803d;--ok-soft:#dcf5e4;--warn:#9a6700;--warn-soft:#fff1c9;--bad:#b42318;--bad-soft:#fde4e1;--gray-soft:#ebe9e3;
  --shadow:0 1px 2px rgba(16,28,51,.06),0 6px 20px rgba(16,28,51,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220;--card:#141c2f;--ink:#e8edf7;--muted:#9aa6bd;--line:#26314a;
    --accent:#3cc6bd;--accent-ink:#06201e;--accent-soft:#12302f;
    --ok:#5fd08a;--ok-soft:#12301f;--warn:#f0c14b;--warn-soft:#352b0d;--bad:#ff8a7e;--bad-soft:#3a1814;--gray-soft:#1d2740;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220;--card:#141c2f;--ink:#e8edf7;--muted:#9aa6bd;--line:#26314a;
  --accent:#3cc6bd;--accent-ink:#06201e;--accent-soft:#12302f;
  --ok:#5fd08a;--ok-soft:#12301f;--warn:#f0c14b;--warn-soft:#352b0d;--bad:#ff8a7e;--bad-soft:#3a1814;--gray-soft:#1d2740;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
a{color:var(--accent)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);letter-spacing:-.02em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0 0 .75rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.1rem}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;margin-top:-2px}
nav.main{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.main a,nav.main button{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem;border:1px solid transparent;background:none;cursor:pointer;font-family:inherit}
nav.main a:hover,nav.main button:hover{background:var(--gray-soft)}
nav.main a.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding:22px 0 60px}
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow);margin-bottom:26px}
.hero p{color:var(--muted);max-width:60ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--gray-soft);font-size:.82rem;font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.link{display:block;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.card.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .meta{color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:2px;margin:6px 0 10px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--gray-soft);color:var(--ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.section{margin-top:28px}
.section>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.progress{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin:6px 0}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress.full>i{background:var(--bad)}
.progress.mid>i{background:var(--warn)}
.filters{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr auto;margin-bottom:14px;align-items:end}
@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .grow{grid-column:1/-1}}
label{display:block;font-weight:600;font-size:.86rem;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:auto;min-height:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.two{display:grid;gap:18px;grid-template-columns:1.2fr 1fr}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.form-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:.82rem;margin-top:3px}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:1.7rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.84rem}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--gray-soft)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
@media(max-width:760px){
  table.stackable thead{display:none}
  table.stackable,table.stackable tbody,table.stackable tr,table.stackable td{display:block;width:100%}
  table.stackable tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 10px}
  table.stackable td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.stackable td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left}
}
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.toast-box{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.ticket{border:2px dashed var(--accent);border-radius:16px;padding:18px;background:var(--accent-soft)}
.ticket .id{font:700 1.5rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em}
.empty{text-align:center;padding:34px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.93rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
@media(max-width:640px){
  header.top{position:static}
  .bar{padding:8px 0;gap:6px}
  nav.main{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav.main a,nav.main button{white-space:nowrap;padding:6px 11px;font-size:.86rem}
  main{padding-top:14px}
}
td .v{display:block}
@media(max-width:760px){table.stackable td .v{text-align:right;min-width:0;overflow-wrap:anywhere}}
@media print{
  header.top,footer,.no-print,.toast-box{display:none!important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/"><span class="logo">F</span><span>FestDesk<small id="orgName">DRMC IT Club</small></span></a>
    <nav class="main" aria-label="Main">
      <a href="#/" data-nav="home">Fests &amp; Events</a>
      <a href="#/my" data-nav="my">My Registrations</a>
      <a href="#/admin" data-nav="admin">Organizer</a>
      <button type="button" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">Theme</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer><div class="wrap">FestDesk &middot; open source (MIT) &middot; demo data is fictional &middot; built for the DRMC International Tech Carnival 2026 AI Web Development Contest</div></footer>
<div class="toast-box" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY='festdesk_db_v1', SESS='festdesk_admin_v1', EMAILKEY='festdesk_email_v1', THEMEKEY='festdesk_theme_v1';
var ADMIN_USER='admin', ADMIN_PASS='admin123';
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rid(n){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}
function fmt(iso){if(!iso)return '-';var d=new Date(iso);return d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});}
function fmtDay(iso){if(!iso)return '-';return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function toLocalInput(iso){var d=new Date(iso);if(isNaN(d))return '';function p(n){return String(n).padStart(2,'0');}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fromLocalInput(v){var d=new Date(v);return isNaN(d)?null:d.toISOString();}
function toast(msg,isErr){var b=$('#toasts');var t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;b.appendChild(t);setTimeout(function(){t.remove();},3600);}

/* ---------- seed data (generated relative to first visit so dates are always current) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seed(){
  var rnd=mulberry(20261009), now=new Date();
  function at(days,h,m){var d=new Date(now);d.setDate(d.getDate()+days);d.setHours(h,m||0,0,0);return d.toISOString();}
  function pick(a){return a[Math.floor(rnd()*a.length)];}
  var db={version:1,org:{name:'DRMC IT Club'},fests:[],events:[],regs:[]};
  db.fests=[
    {id:'f-tech',name:'Tech Carnival 2026',desc:'The flagship annual tech fest of DRMC IT Club: contests, robotics and gaming across two days.',venue:'DRMC Auditorium & Labs',start:at(21,9),end:at(22,18)},
    {id:'f-winter',name:'Winter Tech Fest 2026',desc:'A cosy winter edition focused on hackathons, hands-on workshops and quizzes.',venue:'DRMC Seminar Hall',start:at(75,10),end:at(76,17)},
    {id:'f-fresh',name:'Freshers Tech Fest 2027',desc:'A welcome event for new students: friendly coding challenges and an intro AI workshop.',venue:'DRMC Computer Lab 2',start:at(140,10),end:at(140,16)}
  ];
  db.events=[
    {id:'e-ai',festId:'f-tech',title:'AI Web Development Contest',category:'Contest',desc:'Build a complete working web app in a fixed time using any AI tools you like. Judged on features, UX, responsiveness and creativity. Teams of 1 to 3.',start:at(21,10),venue:'Computer Lab 1',deadline:at(14,23,59),capacity:60,approval:'auto',info:'Free entry. Bring a laptop. Submit a public GitHub repo and a live link.'},
    {id:'e-prog',festId:'f-tech',title:'Programming Contest',category:'Contest',desc:'ACM-style individual contest with 8 problems of rising difficulty. C, C++, Java and Python are supported.',start:at(21,14),venue:'Computer Lab 2',deadline:at(15,23,59),capacity:80,approval:'auto',info:'Free entry. Individual participation only. Practice set is shared after registration.'},
    {id:'e-robo',festId:'f-tech',title:'Robotics Challenge',category:'Robotics',desc:'Line-following and obstacle-avoidance race for student-built robots. Inspection happens one hour before the start.',start:at(22,10),venue:'Open Courtyard',deadline:at(12,23,59),capacity:24,approval:'manual',info:'Team of 2 to 4. Registration is confirmed after the organizers review your robot spec.'},
    {id:'e-game',festId:'f-tech',title:'Gaming Tournament',category:'Gaming',desc:'1v1 knockout bracket on PC. Fair play rules apply and the bracket is published a day before the event.',start:at(22,14),venue:'Multimedia Room',deadline:at(10,23,59),capacity:20,approval:'auto',info:'Free entry. Bring your own peripherals if you prefer them.'},
    {id:'e-quizq',festId:'f-tech',title:'Tech Quiz Qualifier',category:'Quiz',desc:'Online qualifier for the Tech Quiz final. 30 questions, 20 minutes.',start:at(16,18),venue:'Online',deadline:at(-1,23,59),capacity:100,approval:'auto',info:'Registration for this qualifier has already closed.'},
    {id:'e-hack',festId:'f-winter',title:'24-Hour Hackathon',category:'Hackathon',desc:'Build something useful for campus life in 24 hours. Mentors on site, food provided.',start:at(75,10),venue:'DRMC Seminar Hall',deadline:at(60,23,59),capacity:50,approval:'manual',info:'Teams of 3 to 4. Organizers confirm teams based on the idea summary.'},
    {id:'e-sec',festId:'f-winter',title:'Intro to Web Security Workshop',category:'Workshop',desc:'Hands-on workshop on the OWASP Top 10 using deliberately vulnerable practice apps in a safe lab.',start:at(76,11),venue:'Computer Lab 1',deadline:at(68,23,59),capacity:40,approval:'auto',info:'Bring a laptop with a modern browser. No prior experience needed.'},
    {id:'e-quiz',festId:'f-winter',title:'Tech Quiz Final',category:'Quiz',desc:'Buzzer-round quiz on computing history, current tech and logic puzzles.',start:at(76,15),venue:'DRMC Seminar Hall',deadline:at(70,23,59),capacity:100,approval:'auto',info:'Teams of 2. Qualifier winners get seeded slots.'},
    {id:'e-code',festId:'f-fresh',title:'Beginner Coding Challenge',category:'Contest',desc:'Friendly problem-solving contest for first-year students. Simple problems and lots of prizes.',start:at(140,10),venue:'Computer Lab 2',deadline:at(130,23,59),capacity:60,approval:'auto',info:'Open to first-year students only.'},
    {id:'e-aiw',festId:'f-fresh',title:'AI Tools Workshop',category:'Workshop',desc:'Learn how to use AI assistants responsibly for study and projects. Includes prompt-writing practice.',start:at(140,13),venue:'Computer Lab 2',deadline:at(132,23,59),capacity:40,approval:'auto',info:'Bring a laptop. Free accounts on public AI tools are enough.'}
  ];
  var first=['Rahim','Karim','Nusrat','Tasnia','Arif','Sabbir','Mim','Farhan','Jannat','Rakib','Sumaiya','Tanvir','Maliha','Imran','Nabila','Shakib','Ritu','Hasan','Lamia','Fahim','Anika','Shihab','Priya','Zubair','Tahmina','Asif','Sadia','Mahin','Orpa','Rafi'];
  var last=['Ahmed','Hossain','Islam','Khan','Rahman','Chowdhury','Akter','Uddin','Sarker','Mia','Das','Biswas','Karim','Sheikh','Talukder'];
  var inst=['DRMC','Dhaka College','Notre Dame College','Viqarunnisa Noon School & College','Dhaka University','BUET','NSU','Jahangirnagar University'];
  var counts={'e-ai':41,'e-prog':56,'e-robo':17,'e-game':20,'e-quizq':63,'e-hack':22,'e-sec':27,'e-quiz':31,'e-code':18,'e-aiw':12};
  var n=0;
  db.events.forEach(function(ev){
    var active=counts[ev.id]||10, extras=ev.capacity>=40?3:1, total=active+extras, k;
    for(k=0;k<total;k++){
      var f=pick(first), l=pick(last), st;
      if(k>=active) st=(k%2?'cancelled':'rejected');
      else if(ev.approval==='manual') st=(rnd()<.55?'confirmed':'pending');
      else st=(rnd()<.9?'confirmed':'pending');
      n++;
      db.regs.push({
        id:'REG-'+(1000+n),
        eventId:ev.id,
        name:f+' '+l,
        email:(f+'.'+l+n+'@example.com').toLowerCase(),
        phone:'01'+pick(['3','5','6','7','8','9'])+String(Math.floor(rnd()*90000000+10000000)),
        inst:pick(inst),
        notes:'',
        status:st,
        createdAt:at(-Math.floor(rnd()*9)-1,Math.floor(rnd()*12)+9,Math.floor(rnd()*60))
      });
    }
  });
  return db;
}
function load(){
  var raw=lsGet(KEY);
  if(raw){try{var d=JSON.parse(raw);if(d&&d.fests&&d.events&&d.regs)return d;}catch(e){}}
  var s=seed();lsSet(KEY,JSON.stringify(s));return s;
}
var db=load();
function save(){lsSet(KEY,JSON.stringify(db));}

/* ---------- domain ---------- */
function fest(id){return db.fests.filter(function(f){return f.id===id;})[0];}
function event(id){return db.events.filter(function(e){return e.id===id;})[0];}
function regsOf(eid){return db.regs.filter(function(r){return r.eventId===eid;});}
function isActive(r){return r.status==='pending'||r.status==='confirmed';}
function taken(eid){return regsOf(eid).filter(isActive).length;}
function seatsLeft(ev){return Math.max(0,ev.capacity-taken(ev.id));}
function state(ev){
  var now=new Date();
  if(new Date(ev.deadline)<now)return {open:false,code:'closed',label:'Registration closed',reason:'The registration deadline for this event has passed.'};
  if(seatsLeft(ev)<=0)return {open:false,code:'full',label:'Full',reason:'This event has reached its capacity.'};
  if(seatsLeft(ev)<=Math.max(3,Math.ceil(ev.capacity*.15)))return {open:true,code:'few',label:'Few seats left',reason:''};
  return {open:true,code:'open',label:'Open',reason:''};
}
function badgeFor(ev){var s=state(ev);var cls=s.code==='open'?'ok':s.code==='few'?'warn':'bad';return '<span class="badge '+cls+'">'+esc(s.label)+'</span>';}
function statusBadge(st){var m={confirmed:'ok',pending:'warn',rejected:'bad',cancelled:''};return '<span class="badge '+(m[st]||'')+'">'+esc(st)+'</span>';}
function bar(ev){var t=taken(ev.id),pct=Math.min(100,Math.round(t/ev.capacity*100));var c=pct>=100?'full':pct>=80?'mid':'';return '<div class="progress '+c+'" role="progressbar" aria-valuemin="0" aria-valuemax="'+ev.capacity+'" aria-valuenow="'+t+'" aria-label="Seats taken"><i style="width:'+pct+'%"></i></div><div class="small muted">'+t+' / '+ev.capacity+' seats taken</div>';}
function categories(){var s={};db.events.forEach(function(e){s[e.category]=1;});return Object.keys(s).sort();}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);}
function validPhone(p){var d=p.replace(/[\s\-+()]/g,'');return /^\d{7,15}$/.test(d);}

function register(ev,d){
  var s=state(ev);if(!s.open)return {ok:false,errors:{_:s.reason}};
  var errors={},name=(d.name||'').trim(),email=(d.email||'').trim().toLowerCase(),phone=(d.phone||'').trim(),inst=(d.inst||'').trim();
  if(name.length<2)errors.name='Please enter your full name.';
  if(!validEmail(email))errors.email='Enter a valid email address.';
  if(!validPhone(phone))errors.phone='Enter a valid phone number (7-15 digits).';
  if(inst.length<2)errors.inst='Enter your institution or class.';
  if(!errors.email&&regsOf(ev.id).some(function(r){return r.email===email&&isActive(r);}))errors.email='This email is already registered for this event.';
  if(Object.keys(errors).length)return {ok:false,errors:errors};
  var reg={id:'REG-'+rid(5),eventId:ev.id,name:name,email:email,phone:phone,inst:inst,notes:(d.notes||'').trim(),status:ev.approval==='manual'?'pending':'confirmed',createdAt:new Date().toISOString()};
  db.regs.push(reg);save();lsSet(EMAILKEY,email);
  return {ok:true,reg:reg};
}

    bar(ev)+'</a>';

function listEvents(){
  var q=ui.q.trim().toLowerCase();
  return db.events.filter(function(e){
    if(ui.cat&&e.category!==ui.cat)return false;
    if(ui.fest&&e.festId!==ui.fest)return false;
    if(ui.openOnly&&!state(e).open)return false;
    if(q){var f=fest(e.festId);var hay=(e.title+' '+e.desc+' '+e.category+' '+e.venue+' '+(f?f.name:'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){return new Date(a.start)-new Date(b.start);});
}

function statsFor(){
  var c={confirmed:0,pending:0,rejected:0,cancelled:0};db.regs.forEach(function(r){c[r.status]=(c[r.status]||0)+1;});return c;
}
function stackBar(c,total){
  var cols={confirmed:'var(--ok)',pending:'var(--warn)',rejected:'var(--bad)',cancelled:'var(--muted)'};
  if(!total)return '';
  return '<div class="stack" role="img" aria-label="Registration status breakdown">'+Object.keys(cols).map(function(k){return '<i style="width:'+(c[k]/total*100)+'%;background:'+cols[k]+'"></i>';}).join('')+'</div><div class="legend">'+Object.keys(cols).map(function(k){return '<span style="--c:'+cols[k]+'">'+k+' '+c[k]+'</span>';}).join('')+'</div>';
}

  var rows=db.events.slice().sort(function(a,b){return new Date(a.start)-new Date(b.start);}).map(function(ev){
    var cc={confirmed:0,pending:0,rejected:0,cancelled:0};regsOf(ev.id).forEach(function(r){cc[r.status]++;});
    return '<tr><td data-label="Event">'+esc(ev.title)+'</td><td data-label="Fest">'+esc((fest(ev.festId)||{}).name||'')+'</td><td data-label="Seats">'+taken(ev.id)+' / '+ev.capacity+'</td><td data-label="Confirmed">'+cc.confirmed+'</td><td data-label="Pending">'+cc.pending+'</td><td data-label="Status">'+badgeFor(ev)+'</td><td data-label="Fill">'+bar(ev)+'</td></tr>';
  }).join('');

    '<div class="card" style="margin-bottom:16px"><h3>Registration status</h3>'+stackBar(c,total)+'</div>'+
    '<div class="card"><h3>Events overview</h3><div class="tablewrap"><table class="stackable"><thead><tr><th>Event</th><th>Fest</th><th>Seats</th><th>Confirmed</th><th>Pending</th><th>State</th><th style="min-width:160px">Fill</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  return '<form id="eventForm" data-id="'+esc(e.id||'')+'" novalidate><h2>'+(e.id?'Edit event':'New event')+'</h2><div class="form-grid">'+
    '<div class="full"><label for="et">Title</label><input id="et" name="title" value="'+esc(e.title)+'"><div class="err" data-err="title"></div></div>'+
    '<div><label for="ef">Fest</label><select id="ef" name="festId">'+fo+'</select></div>'+
    '<div><label for="ec">Category</label><select id="ec" name="category">'+catOpts+'</select></div>'+
    '<div class="full"><label for="ed">Description</label><textarea id="ed" name="desc">'+esc(e.desc)+'</textarea></div>'+
    '<div><label for="es">Starts</label><input id="es" type="datetime-local" name="start" value="'+esc(e.start?toLocalInput(e.start):'')+'"><div class="err" data-err="start"></div></div>'+
    '<div><label for="ev">Venue</label><input id="ev" name="venue" value="'+esc(e.venue)+'"></div>'+
    '<div><label for="edl">Registration deadline</label><input id="edl" type="datetime-local" name="deadline" value="'+esc(e.deadline?toLocalInput(e.deadline):'')+'"><div class="err" data-err="deadline"></div></div>'+
    '<div><label for="ecap">Capacity</label><input id="ecap" type="number" min="1" name="capacity" value="'+esc(e.capacity||50)+'"><div class="err" data-err="capacity"></div></div>'+
    '<div class="full"><label for="eap">Approval</label><select id="eap" name="approval"><option value="auto"'+(e.approval!=='manual'?' selected':'')+'>Instant confirmation</option><option value="manual"'+(e.approval==='manual'?' selected':'')+'>Organizer approval required</option></select></div>'+
    '<div class="full"><label for="ei">Registration information</label><textarea id="ei" name="info">'+esc(e.info)+'</textarea></div></div>'+
    '<div class="err" data-err="_"></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Save event</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>';
}
function myEditForm(r){
  return '<form id="myEditForm" data-id="'+esc(r.id)+'" novalidate><h2>Edit my details</h2><div class="form-grid"><div class="full"><label for="mn">Full name</label><input id="mn" name="name" value="'+esc(r.name)+'"><div class="err" data-err="name"></div></div><div><label for="mp">Phone</label><input id="mp" name="phone" value="'+esc(r.phone)+'"><div class="err" data-err="phone"></div></div><div><label for="mi">Institution / class</label><input id="mi" name="inst" value="'+esc(r.inst)+'"><div class="err" data-err="inst"></div></div></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>';
}
function formData(form){var o={};$$('input,select,textarea',form).forEach(function(el){if(el.name)o[el.name]=el.type==='checkbox'?el.checked:el.value;});return o;}
function showErrors(form,errors){$$('[data-err]',form).forEach(function(el){el.textContent=errors[el.getAttribute('data-err')]||'';});}

/* ---------- csv ---------- */
function csvCell(v){var s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){
  var rows=[['Registration ID','Name','Email','Phone','Institution','Event','Fest','Status','Registered at','Notes']];
  partList().forEach(function(r){var ev=event(r.eventId)||{};rows.push([r.id,r.name,r.email,r.phone,r.inst,ev.title||'',(fest(ev.festId)||{}).name||'',r.status,r.createdAt,r.notes]);});
  var csv=rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
  try{var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='participants.csv';document.body.appendChild(a);a.click();a.remove();toast('CSV exported ('+(rows.length-1)+' rows)');}
  catch(e){toast('Export is not supported in this browser',true);}
  return csv;
}
window.__festdeskCsv=exportCsv;

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace(/^#/,'')||'/',p=h.split('/').filter(Boolean),html,nav='home';
  if(!p.length)html=viewHome();
  else if(p[0]==='fest')html=viewFest(p[1]);
  else if(p[0]==='event')html=viewEvent(p[1]);
  else if(p[0]==='my'){html=viewMy();nav='my';}
  else if(p[0]==='admin'){html=viewAdmin();nav='admin';}
  else html=notFound();
  $('#app').innerHTML=html;
  $$('nav.main a').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-nav')===nav);});
  document.title=(p[0]==='admin'?'Organizer':p[0]==='my'?'My Registrations':p[0]==='event'&&event(p[1])?event(p[1]).title:p[0]==='fest'&&fest(p[1])?fest(p[1]).name:'Fests & Events')+' · FestDesk';
  if(p[0]!=='event')ui.lastReg=null;
  window.scrollTo(0,0);
}
function rerender(){var y=window.scrollY;var h=location.hash.replace(/^#/,'')||'/';var p=h.split('/').filter(Boolean);var html;
  if(!p.length)html=viewHome();else if(p[0]==='fest')html=viewFest(p[1]);else if(p[0]==='event')html=viewEvent(p[1]);else if(p[0]==='my')html=viewMy();else if(p[0]==='admin')html=viewAdmin();else html=notFound();
  $('#app').innerHTML=html;window.scrollTo(0,y);}
window.addEventListener('hashchange',route);

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;$('#results').innerHTML=resultsHtml();}
  else if(t.id==='pq'){ui.pq=t.value;$('#ptable').innerHTML=partTable();}
  if(t.form&&t.name){var er=$('[data-err="'+t.name+'"]',t.form);if(er)er.textContent='';var g=$('[data-err="_"]',t.form);if(g)g.textContent='';}
});
document.addEventListener('change',function(e){
  var t=e.target,act=t.getAttribute&&t.getAttribute('data-act');
  if(t.id==='cat'){ui.cat=t.value;$('#results').innerHTML=resultsHtml();}
  else if(t.id==='festf'){ui.fest=t.value;$('#results').innerHTML=resultsHtml();}
  else if(t.id==='openonly'){ui.openOnly=t.checked;$('#results').innerHTML=resultsHtml();}
  else if(t.id==='pev'){ui.pev=t.value;$('#ptable').innerHTML=partTable();}
  else if(t.id==='pst'){ui.pst=t.value;$('#ptable').innerHTML=partTable();}
  else if(act==='setstatus'){
    if(!isAdmin())return;
    var r=db.regs.filter(function(x){return x.id===t.getAttribute('data-id');})[0];if(!r)return;
    var ev=event(r.eventId),was=isActive(r),next=t.value;
    if(!was&&(next==='pending'||next==='confirmed')&&ev&&seatsLeft(ev)<=0){toast('No seats left for this event. Raise its capacity first.',true);t.value=r.status;return;}
    r.status=next;save();toast('Status updated to '+next);$('#ptable').innerHTML=partTable();
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='modal-bg'){if(e.target===el)closeModal();return;}
  if(act==='close'){closeModal();return;}
  if(act==='print'){window.print();return;}
  if(act==='tab'){ui.adminTab=el.getAttribute('data-tab');rerender();return;}
  if(act==='logout'){ssSet(SESS,null);rerender();return;}
  if(act==='reset'){if(confirm('Reset all demo data? Registrations you added will be lost.')){db=seed();save();ui.lastReg=null;toast('Demo data reset');rerender();}return;}
  if(act==='csv'){exportCsv();return;}
  if(act==='new-fest'){openModal(festForm());return;}
  if(act==='edit-fest'){openModal(festForm(fest(id)));return;}
  if(act==='new-event'){if(!db.fests.length){toast('Create a fest first',true);return;}openModal(eventForm());return;}
  if(act==='edit-event'){openModal(eventForm(event(id)));return;}
  if(act==='del-fest'){var n=db.events.filter(function(x){return x.festId===id;}).length;if(confirm('Delete this fest'+(n?' and its '+n+' event(s) with all registrations':'')+'?')){var evIds=db.events.filter(function(x){return x.festId===id;}).map(function(x){return x.id;});db.regs=db.regs.filter(function(r){return evIds.indexOf(r.eventId)<0;});db.events=db.events.filter(function(x){return x.festId!==id;});db.fests=db.fests.filter(function(x){return x.id!==id;});save();toast('Fest deleted');rerender();}return;}
  if(act==='del-event'){if(confirm('Delete this event and all its registrations?')){db.regs=db.regs.filter(function(r){return r.eventId!==id;});db.events=db.events.filter(function(x){return x.id!==id;});save();toast('Event deleted');rerender();}return;}
  if(act==='del-reg'){if(confirm('Remove this registration permanently?')){db.regs=db.regs.filter(function(r){return r.id!==id;});save();toast('Registration removed');$('#ptable').innerHTML=partTable();}return;}
  if(act==='edit-my'){var r=db.regs.filter(function(x){return x.id===id;})[0];if(r)openModal(myEditForm(r));return;}
  if(act==='cancel-my'){var rr=db.regs.filter(function(x){return x.id===id;})[0];if(rr&&confirm('Cancel this registration? Your seat will be released.')){rr.status='cancelled';save();toast('Registration cancelled');rerender();}return;}
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='regForm'){
    var ev=event(f.getAttribute('data-event'));if(!ev)return;
    var res=register(ev,formData(f));
    if(!res.ok){showErrors(f,res.errors);var first=$('.err:not(:empty)',f);if(first&&first.previousElementSibling&&first.previousElementSibling.focus)first.previousElementSibling.focus();return;}
    ui.lastReg=res.reg;ui.myEmail=res.reg.email;toast('Registration '+(res.reg.status==='confirmed'?'confirmed':'received')+'!');rerender();
  }
  else if(f.id==='myForm'){ui.myEmail=$('#myemail').value;ui.myChecked=true;if(validEmail(ui.myEmail.trim()))lsSet(EMAILKEY,ui.myEmail.trim().toLowerCase());rerender();}
  else if(f.id==='loginForm'){
    if($('#lu').value.trim()===ADMIN_USER&&$('#lp').value===ADMIN_PASS){ssSet(SESS,'1');rerender();}
    else $('#lerr').textContent='Wrong username or password.';
  }
  else if(f.id==='myEditForm'){
    var r=db.regs.filter(function(x){return x.id===f.getAttribute('data-id');})[0];if(!r)return;
    var d=formData(f),errs={};
    if((d.name||'').trim().length<2)errs.name='Please enter your full name.';
    if(!validPhone(d.phone||''))errs.phone='Enter a valid phone number.';
    if((d.inst||'').trim().length<2)errs.inst='Enter your institution or class.';
    if(Object.keys(errs).length){showErrors(f,errs);return;}
    r.name=d.name.trim();r.phone=d.phone.trim();r.inst=d.inst.trim();save();closeModal();toast('Details updated');rerender();
  }
  else if(f.id==='festForm'){
    var d2=formData(f),er={},s=fromLocalInput(d2.start),en=fromLocalInput(d2.end);
    if(!(d2.name||'').trim())er.name='Name is required.';
    if(!s)er.start='Pick a start date.';
    if(!en)er.end='Pick an end date.';
    if(s&&en&&new Date(en)<new Date(s))er.end='End must be after start.';
    if(Object.keys(er).length){showErrors(f,er);return;}
    var fid=f.getAttribute('data-id'),obj=fid?fest(fid):null;
    if(!obj){obj={id:'f-'+rid(6).toLowerCase()};db.fests.push(obj);}
    obj.name=d2.name.trim();obj.desc=d2.desc.trim();obj.venue=d2.venue.trim();obj.start=s;obj.end=en;
    save();closeModal();toast('Fest saved');rerender();
  }
  else if(f.id==='eventForm'){
    var d3=formData(f),e3={},st=fromLocalInput(d3.start),dl=fromLocalInput(d3.deadline),cap=parseInt(d3.capacity,10);
    if(!(d3.title||'').trim())e3.title='Title is required.';
    if(!st)e3.start='Pick a start time.';
    if(!dl)e3.deadline='Pick a deadline.';
    if(st&&dl&&new Date(dl)>new Date(st))e3.deadline='Deadline must be before the event starts.';
    if(!(cap>0))e3.capacity='Capacity must be at least 1.';
    var eid=f.getAttribute('data-id');
    if(eid&&cap>0&&cap<taken(eid))e3.capacity='Capacity cannot be below the '+taken(eid)+' active registrations.';
    if(Object.keys(e3).length){showErrors(f,e3);return;}
    var o=eid?event(eid):null;
    if(!o){o={id:'e-'+rid(6).toLowerCase()};db.events.push(o);}
    o.title=d3.title.trim();o.festId=d3.festId;o.category=d3.category;o.desc=d3.desc.trim();o.start=st;o.venue=d3.venue.trim();o.deadline=dl;o.capacity=cap;o.approval=d3.approval;o.info=d3.info.trim();
    save();closeModal();toast('Event saved');rerender();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------- theme ---------- */
(function(){
  var t=lsGet(THEMEKEY);if(t)document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur?cur==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark';document.documentElement.setAttribute('data-theme',next);lsSet(THEMEKEY,next);
  });
})();

$('#orgName').textContent=db.org.name;
route();
window.__festdesk={getDb:function(){return db;},state:state,register:register};
})();
</script>
